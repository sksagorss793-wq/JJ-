name: Build Jarvis Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project if uploaded as zip or subfolder
        shell: bash
        run: |
          shopt -s nullglob dotglob
          if [ ! -f settings.gradle.kts ]; then
            for z in *.zip; do
              case "$z" in
                *"("*) ;;
                *) echo "Extracting $z..."; unzip -o "$z" -x ".github/*" ;;
              esac
            done
            while IFS= read -r z; do
              [ -n "$z" ] && echo "Extracting newer $z..." && unzip -o "$z" -x ".github/*"
            done < <(printf '%s\n' *.zip | grep '(' | sort -V || true)
          fi
          if [ ! -f settings.gradle.kts ]; then
            for sub in */; do
              if [ -f "${sub}settings.gradle.kts" ]; then
                echo "Moving project from ${sub}..."
                mv "${sub}"* .
                break
              fi
            done
          fi
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::Android project files not found! Please upload jarvis-android-system.zip to this repository."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-System-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
